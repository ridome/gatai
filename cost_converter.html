    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const exchangeRateInput = document.getElementById('exchangeRate');
            const inputs = document.querySelectorAll('input.calc-input');

            // Initial calculation
            recalculateAll('rmb');

            // Event Listeners
            exchangeRateInput.addEventListener('input', function() {
                recalculateAll('rmb'); // Recalculate USD based on RMB
            });

            inputs.forEach(input => {
                input.addEventListener('input', function(e) {
                    const row = e.target.closest('tr');
                    const classes = e.target.classList;

                    // Determine if RMB or USD changed
                    let isRmb = false;
                    let counterpartClass = '';

                    if (classes.contains('hh2-accessory-rmb')) { isRmb = true; counterpartClass = 'hh2-accessory-usd'; }
                    else if (classes.contains('hh2-accessory-usd')) { isRmb = false; counterpartClass = 'hh2-accessory-rmb'; }
                    else if (classes.contains('hh4-accessory-rmb')) { isRmb = true; counterpartClass = 'hh4-accessory-usd'; }
                    else if (classes.contains('hh4-accessory-usd')) { isRmb = false; counterpartClass = 'hh4-accessory-rmb'; }

                    else if (classes.contains('hh2-structure-rmb')) { isRmb = true; counterpartClass = 'hh2-structure-usd'; }
                    else if (classes.contains('hh2-structure-usd')) { isRmb = false; counterpartClass = 'hh2-structure-rmb'; }
                    else if (classes.contains('hh4-structure-rmb')) { isRmb = true; counterpartClass = 'hh4-structure-usd'; }
                    else if (classes.contains('hh4-structure-usd')) { isRmb = false; counterpartClass = 'hh4-structure-rmb'; }

                    else if (classes.contains('hh2-pcba-rmb')) { isRmb = true; counterpartClass = 'hh2-pcba-usd'; }
                    else if (classes.contains('hh2-pcba-usd')) { isRmb = false; counterpartClass = 'hh2-pcba-rmb'; }
                    else if (classes.contains('hh4-pcba-rmb')) { isRmb = true; counterpartClass = 'hh4-pcba-usd'; }
                    else if (classes.contains('hh4-pcba-usd')) { isRmb = false; counterpartClass = 'hh4-pcba-rmb'; }

                    if (counterpartClass) {
                        const rate = parseFloat(exchangeRateInput.value) || 0;
                        const counterpartInput = row.querySelector('.' + counterpartClass);
                        const val = parseFloat(e.target.value);

                        if (!isNaN(val) && rate !== 0) {
                            if (isRmb) {
                                counterpartInput.value = (val / rate).toFixed(3);
                            } else {
                                counterpartInput.value = (val * rate).toFixed(2); // RMB usually 2 decimals
                            }
                        } else if (e.target.value === '') {
                             counterpartInput.value = '';
                        }
                    }

                    calculateSummaries();
                });
            });

            function recalculateAll(base) {
                const rate = parseFloat(exchangeRateInput.value) || 0;
                if (rate === 0) return;

                const groups = ['hh2-accessory', 'hh4-accessory', 'hh2-structure', 'hh4-structure', 'hh2-pcba', 'hh4-pcba'];

                groups.forEach(group => {
                    const rmbInputs = document.querySelectorAll('.' + group + '-rmb');
                    const usdInputs = document.querySelectorAll('.' + group + '-usd');

                    if (base === 'rmb') {
                        rmbInputs.forEach((input, index) => {
                            const val = parseFloat(input.value);
                            if (!isNaN(val)) {
                                usdInputs[index].value = (val / rate).toFixed(3);
                            }
                        });
                    } else {
                         // Implement if needed, currently defaulting to RMB base on rate change
                         usdInputs.forEach((input, index) => {
                            const val = parseFloat(input.value);
                            if (!isNaN(val)) {
                                rmbInputs[index].value = (val * rate).toFixed(2);
                            }
                        });
                    }
                });
                calculateSummaries();
            }

            function calculateSummaries() {
                // Sum helper
                function sumInputs(selector) {
                    let sum = 0;
                    document.querySelectorAll(selector).forEach(input => {
                        const val = parseFloat(input.value);
                        if (!isNaN(val)) sum += val;
                    });
                    return sum;
                }

                // PCBA
                const hh2_pcba_rmb = sumInputs('.hh2-pcba-rmb');
                const hh2_pcba_usd = sumInputs('.hh2-pcba-usd');
                const hh4_pcba_rmb = sumInputs('.hh4-pcba-rmb');
                const hh4_pcba_usd = sumInputs('.hh4-pcba-usd');

                document.getElementById('hh2_mainboard_rmb').value = hh2_pcba_rmb.toFixed(3); // Using 3 decimals for summary to match image precision? Image has 154.815
                document.getElementById('hh2_mainboard_usd').value = hh2_pcba_usd.toFixed(3);
                document.getElementById('hh4_mainboard_rmb').value = hh4_pcba_rmb.toFixed(3);
                document.getElementById('hh4_mainboard_usd').value = hh4_pcba_usd.toFixed(3);

                // Structure
                const hh2_structure_rmb = sumInputs('.hh2-structure-rmb');
                const hh2_structure_usd = sumInputs('.hh2-structure-usd');
                const hh4_structure_rmb = sumInputs('.hh4-structure-rmb');
                const hh4_structure_usd = sumInputs('.hh4-structure-usd');

                // Bare Unit = Structure + PCBA
                const hh2_bare_rmb = hh2_structure_rmb + hh2_pcba_rmb;
                const hh2_bare_usd = hh2_structure_usd + hh2_pcba_usd;
                const hh4_bare_rmb = hh4_structure_rmb + hh4_pcba_rmb;
                const hh4_bare_usd = hh4_structure_usd + hh4_pcba_usd;

                document.getElementById('hh2_bare_rmb').value = hh2_bare_rmb.toFixed(3);
                document.getElementById('hh2_bare_usd').value = hh2_bare_usd.toFixed(3);
                document.getElementById('hh4_bare_rmb').value = hh4_bare_rmb.toFixed(3);
                document.getElementById('hh4_bare_usd').value = hh4_bare_usd.toFixed(3);

                // Accessories
                const hh2_accessory_rmb = sumInputs('.hh2-accessory-rmb');
                const hh2_accessory_usd = sumInputs('.hh2-accessory-usd');
                const hh4_accessory_rmb = sumInputs('.hh4-accessory-rmb');
                const hh4_accessory_usd = sumInputs('.hh4-accessory-usd');

                // Finished Product = Bare Unit + Accessories
                const hh2_total_rmb = hh2_bare_rmb + hh2_accessory_rmb;
                const hh2_total_usd = hh2_bare_usd + hh2_accessory_usd;
                const hh4_total_rmb = hh4_bare_rmb + hh4_accessory_rmb;
                const hh4_total_usd = hh4_bare_usd + hh4_accessory_usd;

                document.getElementById('hh2_total_rmb').value = hh2_total_rmb.toFixed(3);
                document.getElementById('hh2_total_usd').value = hh2_total_usd.toFixed(3);
                document.getElementById('hh4_total_rmb').value = hh4_total_rmb.toFixed(3);
                document.getElementById('hh4_total_usd').value = hh4_total_usd.toFixed(3);
            }
        });
    </script>
</body>
</html>
