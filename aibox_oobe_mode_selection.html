<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reolink AI Box - OOBE Mode Selection</title>
    <style>
        :root {
            /* Colors */
            --primary-blue: #005EBC;
            --bg-color: #F5F7FA;
            --card-bg-selected: #F0F7FF;
            --card-bg: #FFFFFF;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color-default: #E0E0E0;
            --border-color-selected: var(--primary-blue);

            /* Typography */
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

            /* Spacing & Sizes */
            --spacing-base: 16px;
            --radius-card: 12px;
            --radius-btn: 24px;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-primary);
            display: flex;
            justify-content: center; /* Center for desktop view */
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px; /* Mobile simulation */
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05); /* Subtle shadow for desktop view */
        }

        /* Header Styles */
        .header {
            padding: 24px var(--spacing-base) 16px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-primary);
        }

        .header p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.5;
        }

        /* Content Area */
        .content {
            flex: 1;
            padding: 0 var(--spacing-base);
            padding-bottom: 80px; /* Space for fixed footer */
        }

        /* Card Styles */
        .mode-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color-default);
            border-radius: var(--radius-card);
            padding: 20px;
            margin-bottom: 16px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease; /* Smooth transition */
            display: flex;
            align-items: flex-start;
        }

        .mode-card.selected {
            background-color: var(--card-bg-selected);
            border-color: var(--border-color-selected);
            box-shadow: 0 4px 12px rgba(0, 94, 188, 0.08);
        }

        .card-content {
            flex: 1;
            padding-right: 12px;
        }

        .card-header-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .card-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 8px;
        }

        .mode-card.selected .card-title {
            color: var(--primary-blue);
        }

        .recommend-tag {
            background-color: var(--primary-blue);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            vertical-align: middle;
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin: 0;
        }

        /* Radio Indicator */
        .radio-indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #C4C4C4;
            flex-shrink: 0;
            margin-top: 2px; /* Align with title */
            position: relative;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .mode-card.selected .radio-indicator {
            border-color: var(--primary-blue);
            background-color: white;
        }

        .mode-card.selected .radio-indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--primary-blue);
        }

        /* Footer */
        .footer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            padding: 16px var(--spacing-base);
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0,0,0,0.05);
            box-sizing: border-box;
            z-index: 100;
        }

        .btn-next {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-blue);
            color: white;
            border: none;
            border-radius: var(--radius-btn);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: center;
            display: block;
        }

        .btn-next:active {
            background-color: #004a94; /* Darker shade for active state */
            transform: scale(0.98);
        }

    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>选择设备运行模式</h1>
            <p>请根据您的家庭安防现状，选择最适合的工作方式。</p>
        </header>

        <!-- Content: Cards -->
        <main class="content">

            <!-- Card A: AI Only (Default Selected) -->
            <div class="mode-card selected" id="card-ai" onclick="selectMode('MODE_AI_ONLY')">
                <div class="card-content">
                    <div class="card-header-row">
                        <span class="card-title">AI 算力增强模式</span>
                        <span class="recommend-tag">推荐</span>
                    </div>
                    <p class="card-desc">
                        我已经有 Reolink 录像机或摄像头。仅使用本设备为现有系统提供全天候的 AI 智能侦测升级，不作为存储中心。
                    </p>
                </div>
                <div class="radio-indicator"></div>
            </div>

            <!-- Card B: Home Hub -->
            <div class="mode-card" id="card-hub" onclick="selectMode('MODE_HOME_HUB')">
                <div class="card-content">
                    <div class="card-header-row">
                        <span class="card-title">Home Hub 模式</span>
                    </div>
                    <p class="card-desc">
                        我正在搭建全新的安防系统。将本设备作为核心中枢，用于统一连接、管理摄像头，并提供本地录像存储。
                    </p>
                </div>
                <div class="radio-indicator"></div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <button class="btn-next" onclick="submitSelection()">下一步</button>
        </footer>
    </div>

    <script>
        // State
        let currentMode = 'MODE_AI_ONLY'; // Default

        /**
         * Selects a mode and updates the UI.
         * @param {string} mode - The mode value ('MODE_AI_ONLY' or 'MODE_HOME_HUB')
         */
        function selectMode(mode) {
            currentMode = mode;
            updateUI();
        }

        /**
         * Updates the visual state of the cards based on currentMode.
         */
        function updateUI() {
            const cardAi = document.getElementById('card-ai');
            const cardHub = document.getElementById('card-hub');

            if (currentMode === 'MODE_AI_ONLY') {
                cardAi.classList.add('selected');
                cardHub.classList.remove('selected');
            } else {
                cardAi.classList.remove('selected');
                cardHub.classList.add('selected');
            }
        }

        /**
         * Submits the selection.
         * Logs to console and shows an alert.
         */
        function submitSelection() {
            console.log("Selected Mode:", currentMode);
            alert("Selected Mode: " + currentMode);
        }
    </script>

</body>
</html>
